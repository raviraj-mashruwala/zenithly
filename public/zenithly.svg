<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Luxurious Rose Gold Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D0A9"/> <!-- Lighter cap -->
      <stop offset="40%" style="stop-color:#E8A87C"/> <!-- Main Rose -->
      <stop offset="100%" style="stop-color:#C4896A"/> <!-- Deep Rose -->
    </linearGradient>
    
    <!-- Dark Metallic Background -->
    <radialGradient id="darkMetal" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#2A2A32"/>
      <stop offset="100%" style="stop-color:#1A1A1E"/>
    </radialGradient>
  </defs>

  <!-- Coin Body: Dark Metallic Circle -->
  <circle cx="16" cy="16" r="14" fill="url(#darkMetal)"/>
  
  <!-- Coin Rim: Elegant Rose Gold Ring -->
  <circle cx="16" cy="16" r="14" stroke="url(#roseGold)" stroke-width="2"/>
  
  <!-- The "Currency Z" Monogram 
       A serif-style Z with a currency slash to signify 'Finance' without cheap bars.
  -->
  <g transform="translate(8, 8) scale(1)">
    <!-- Main Z Path -->
    <path d="M2,4 H14 L2,12 H14" 
          stroke="url(#roseGold)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- The Currency Slashes (Vertical lines cutting through) 
         Use a mask or just overlay. Overlaying matching stroke color looks like part of the glyph.
         Actually, let's draw them crossing the Z.
    -->
    <path d="M8,2 V14" 
          stroke="url(#roseGold)" 
          stroke-width="1.5" 
          stroke-linecap="round"
          opacity="0.8"/>
  </g>
</svg>
